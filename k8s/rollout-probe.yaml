# Apply only for the local rolling-update demonstration, after loading image 1.0.0.
apiVersion: batch/v1
kind: Job
metadata:
  name: rollout-probe
  namespace: devops-task
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 150
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: probe
          image: devops-observable-service:1.0.0
          imagePullPolicy: Never
          command: [python, -u, -c]
          args:
            - |
              import json, time, urllib.request
              failures = 0
              versions = set()
              print("PROBE_STARTED", flush=True)
              for number in range(320):
                  try:
                      with urllib.request.urlopen("http://app/", timeout=2) as response:
                          payload = json.load(response)
                          versions.add(payload["version"])
                          print(json.dumps({"request": number, "status": response.status, "version": payload["version"]}), flush=True)
                  except Exception as exc:
                      failures += 1
                      print(json.dumps({"request": number, "error": str(exc)}), flush=True)
                  time.sleep(0.25)
              print(json.dumps({"requests": 320, "failures": failures, "versions": sorted(versions)}), flush=True)
              raise SystemExit(1 if failures else 0)
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
