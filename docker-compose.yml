name: devops-observable

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-devops-observable-service:1.0.0}
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-1.0.0}
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENABLE_DEMO_ENDPOINTS: ${ENABLE_DEMO_ENDPOINTS:-false}
      DEMO_TOKEN: ${DEMO_TOKEN:-}
    ports: ["127.0.0.1:8080:8080"]
    networks: [frontend, observability]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [observability]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  loki:
    image: grafana/loki:3.7.10
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [observability]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  alloy:
    image: grafana/alloy:v1.22.0
    profiles: [monitoring]
    user: "0:0"
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    networks: [observability]
    depends_on: [loki]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    profiles: [monitoring]
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --no-collector.netdev.netlink
      - --no-collector.netclass.netlink
      - --no-collector.arp.netlink
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      # /proc/net follows the reader's namespace; use PID 1's host counters.
      - /proc/1/net:/host/proc/net:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks: [observability]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *logging

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    profiles: [monitoring]
    privileged: true
    cgroup: host
    command: [--docker_only=true, --housekeeping_interval=15s]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [observability]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/application.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [frontend, observability]
    depends_on: [prometheus, loki]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

networks:
  frontend:
  observability:
    internal: true

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
