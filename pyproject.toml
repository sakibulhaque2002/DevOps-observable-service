[project]
name = "devops-observable-service"
version = "1.0.0"
description = "An observable FastAPI service with reproducible delivery and infrastructure"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.7",
  "uvicorn==0.54.0",
  "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.5",
  "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
