name: Release and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a deployment midway through a container switch.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive immutable SHA and unique semantic version tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          BASE_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          VERSION="${BASE_VERSION}-build.${RUN_NUMBER}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=app-multiarch
          cache-to: type=gha,mode=max,scope=app-multiarch
          provenance: mode=max
          sbom: true

  scan-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - name: Scan each published architecture before allowing deployment
        env:
          IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          ARCH: ${{ matrix.architecture }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD:/work" \
            aquasec/trivy:0.76.2 image --image-src remote --platform "linux/$ARCH" \
            --scanners vuln --severity CRITICAL --exit-code 1 --format json \
            --output "/work/trivy-$ARCH.json" "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-scan-${{ matrix.architecture }}
          path: trivy-*.json
          retention-days: 7

  deploy:
    needs: [publish, scan-release]
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy through SSM, smoke test and automatically restore on failure
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: python3 scripts/ssm_deploy.py
